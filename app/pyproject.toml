[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "faker>=40.53.0",
    "fastapi>=0.162.2",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
